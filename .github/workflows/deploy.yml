name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site-dev
        uses: actions/checkout@v4
        with:
          ref: site-dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish dist to master
        run: |
          git fetch origin master
          git worktree add publish-dir origin/master
          cd publish-dir
          git rm -rf --ignore-unmatch -- . ':!.github'
          cp -r ../dist/. .
          git add -A
          git commit -m "Deploy $(date -u +%Y-%m-%dT%H:%M:%SZ)" --allow-empty
          git push origin HEAD:master
          cd ..
          git worktree remove publish-dir --force
